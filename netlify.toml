[build]
  command = "npx vite build"
  publish = "dist"

# The game lives under /predictionengine2027/ (build output is dist/predictionengine2027).
[[redirects]]
  from = "/"
  to = "/predictionengine2027/"
  status = 301
  force = false

# The host panel's address (the app reads the path and shows the password gate).
[[redirects]]
  from = "/predictionengine2027/host"
  to = "/predictionengine2027/index.html"
  status = 200
