[build]
  # The last two steps give the host panel a real page at /predictionengine2027/host (the app reads the path).
  command = "npx vite build && mkdir -p dist/predictionengine2027/host && cp dist/predictionengine2027/index.html dist/predictionengine2027/host/index.html"
  publish = "dist"

# The game lives under /predictionengine2027/ (build output is dist/predictionengine2027).
[[redirects]]
  from = "/"
  to = "/predictionengine2027/"
  status = 301
  force = false
